# =============================================================================
# 独立仓库中的手动编译工作流（workflow_dispatch）
# 目标项目：https://github.com/AdrianLuo-X/ConcordRTS
#
# 说明：
#   1. 本文件放在"独立仓库"（非源仓库）的 .github/workflows/ 目录下即可使用，
#      源仓库 ConcordRTS 无需任何改动。
#   2. 工作流通过 actions/checkout 的 repository 参数拉取源仓库源码；
#      源仓库为 public，默认 GITHUB_TOKEN 即可读取。
#   3. 编译完全复用项目自带构建入口 tools/Build-Game.ps1（与 README 中
#      的 编译.cmd 等价），保证 CI 与本地手动编译行为一致：
#      CMake 配置 -> 构建 Release 目标 concord_runtime -> 连带构建 Win32
#      视频桥接 BinkFrameExtractor -> 收集 VC++ 运行库 DLL -> 汇总到 bin/。
#   4. GitHub windows-latest 运行器已预装 Visual Studio 2022（含"使用 C++
#      的桌面开发"负载、x64/Win32 工具链、Windows SDK）与 CMake，
#      因此无需额外安装步骤；第 2、3 步只做显式校验，缺件时尽早失败。
# =============================================================================
name: Build ConcordRTS (manual)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "要编译的 ConcordRTS 分支 / 标签 / 提交 SHA（默认 main）"
        required: true
        default: "main"

permissions:
  contents: read

# 串行构建较久，避免同一分支并发触发多个重型任务互相抢占运行器
concurrency:
  group: build-concordrts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Windows x64 / Release
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      # ---------- 1. 源码获取 ----------
      - name: "1. 检出 ConcordRTS 源码（环境准备：操作系统 = windows-latest / Windows x64）"
        uses: actions/checkout@v4
        with:
          repository: AdrianLuo-X/ConcordRTS
          ref: ${{ inputs.source_ref }}
          path: ConcordRTS

      # ---------- 2. 工具链校验（环境准备：Visual Studio 2022 + CMake） ----------
      - name: "2. 校验工具链（Visual Studio 2022 C++ / CMake / Windows SDK）"
        working-directory: ConcordRTS
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw 'vswhere.exe 不存在：运行器未安装 Visual Studio。'
          }
          $vsHome = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vsVersion = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          Write-Host "Visual Studio : $vsVersion"
          Write-Host "Installation : $vsHome"
          if (-not $vsHome) {
            throw '未找到包含 VC.Tools.x86.x64（C++ x64/Win32 工具链）的 Visual Studio 安装。'
          }
          if ([version]$vsVersion -lt [version]'17.0') {
            throw "需要 Visual Studio 2022 (17.x) 或更高版本，当前为 $vsVersion。"
          }
          # 项目脚本优先使用 VS 自带 CMake，缺失时回退 PATH 中的 cmake
          $vsCmake = Join-Path $vsHome 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          $cmakeExe = $null
          if (Test-Path -LiteralPath $vsCmake) { $cmakeExe = $vsCmake }
          else { $cmakeExe = (Get-Command cmake.exe -ErrorAction SilentlyContinue).Source }
          if (-not $cmakeExe) {
            throw '未找到 CMake（VS 自带与 PATH 均无），请启用 VS 的 C++ CMake 工具组件。'
          }
          Write-Host "CMake        : $cmakeExe"
          & $cmakeExe --version | Select-Object -First 1
          Write-Host '工具链校验通过。'

      # ---------- 3. 依赖安装 ----------
      - name: "3. 依赖安装（本项目无第三方依赖，仅校验）"
        working-directory: ConcordRTS
        run: |
          git --version
          # 上游根 CMakeLists.txt 仅 include(cmake/*.cmake)，目标只链接 Windows 系统
          # 导入库（winmm / ws2_32 / bcrypt / secur32 / crypt32 / comdlg32 /
          # xaudio2 / ole32 / xapobase），无 vcpkg / FetchContent / Python 依赖。
          # 此处显式校验：一旦上游未来引入外部依赖，本步骤会立即失败提示补充安装。
          foreach ($manifest in @('vcpkg.json', 'conanfile.txt', 'conanfile.py', 'requirements.txt')) {
            if (Test-Path -LiteralPath $manifest) {
              throw "检测到依赖清单 $manifest，需要在本工作流中补充依赖安装步骤。"
            }
          }
          $cmakeFiles = Get-ChildItem -LiteralPath . -Recurse -File -Include '*.txt', '*.cmake' |
            Where-Object { $_.FullName -notmatch '\\build\\' }
          $externalRefs = $cmakeFiles |
            ForEach-Object { Select-String -LiteralPath $_.FullName -Pattern 'find_package\s*\(|FetchContent|vcpkg_from_github' -ErrorAction SilentlyContinue }
          if ($externalRefs) {
            $detail = ($externalRefs | ForEach-Object { "$($_.Path): $($_.Line.Trim())" }) -join "`n"
            throw "CMake 配置中出现外部依赖引用，需要补充安装步骤：`n$detail"
          }
          Write-Host '已确认：编译仅依赖 Visual Studio 2022 C++ 工具链 + Windows SDK（运行器预装），无第三方包需要安装。'

      # ---------- 4. 编译 / 构建 ----------
      - name: "4. 编译 ConcordRTS（复用项目自带 tools/Build-Game.ps1）"
        working-directory: ConcordRTS
        run: |
          # 与仓库根目录 编译.cmd 等价的调用方式；脚本内部完成：
          #   vswhere 定位 VS -> 选择 "Visual Studio 17 2022" 生成器（VS18+ 则为 18 2026）
          #   -> cmake -A x64 配置 -> cmake --build --config Release --target concord_runtime
          #   -> 联动 Win32 子构建 BinkFrameExtractor 并暂存到 Release 目录
          #   -> 复制 VC++ 可再发行组件 DLL 到 bin/
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/Build-Game.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Build-Game.ps1 失败，退出码 $LASTEXITCODE"
          }
          Write-Host 'Build-Game.ps1 执行成功。'

      # ---------- 5. 产物核对 ----------
      - name: "5. 核对构建产物（输出路径 bin/）"
        working-directory: ConcordRTS
        run: |
          $binDir = Join-Path (Get-Location) 'bin'
          if (-not (Test-Path -LiteralPath $binDir)) {
            throw "未找到产物目录 $binDir"
          }
          Write-Host "产物目录：$binDir"
          Get-ChildItem -LiteralPath $binDir -File |
            Sort-Object Name |
            ForEach-Object { "{0,-28} {1,12:N0} bytes" -f $_.Name, $_.Length }
          foreach ($required in @('concord_runtime.exe', 'BinkFrameExtractor.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $binDir $required))) {
              throw "缺少关键产物：$required"
            }
          }
          # VC++ 运行库 DLL（由构建脚本从 VS 可再发行组件目录复制）
          foreach ($dll in @('msvcp140.dll', 'msvcp140_atomic_wait.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $binDir $dll))) {
              throw "缺少 VC++ 运行库：$dll"
            }
          }
          Write-Host '产物核对通过。'

      # ---------- 6. 产物上传 ----------
      - name: "6. 上传构建产物（upload-artifact）"
        uses: actions/upload-artifact@v4
        with:
          name: ConcordRTS-windows-x64
          path: ConcordRTS/bin/
          if-no-files-found: error
          retention-days: 14
